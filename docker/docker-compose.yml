services:

  nginx:
    image: nginx:1.27-alpine
    container_name: taskman-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../:/var/www:ro
    networks:
      - frontend
    depends_on:
      - app

  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: taskman-app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-taskmanager}
      DB_USERNAME: ${DB_USERNAME:-taskman}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ../:/var/www
      - app_storage:/var/www/storage
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: taskman-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-taskmanager}
      MYSQL_USER: ${DB_USERNAME:-taskman}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  db_data:
    driver: local
    name: taskman_db_data
  app_storage:
    driver: local
    name: taskman_app_storage

networks:
  frontend:
    driver: bridge
    name: taskman_frontend
  backend:
    driver: bridge
    name: taskman_backend
    internal: true
